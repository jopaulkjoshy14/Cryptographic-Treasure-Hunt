<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Participant Portal | Cryptographic Treasure Hunt</title>

    <link rel="icon"
          href="../assets/favicon.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Shared Styles -->
    <link rel="stylesheet"
          href="../shared/styles.css">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg">

                <div class="card-header text-center">

                    <h1 class="mb-2">
                        🗝️ Cryptographic Treasure Hunt
                    </h1>

                    <h4 class="mb-1">
                        Participant Portal
                    </h4>

                    <p class="mb-0">
                        Enter or scan the encrypted clue and key to reveal your next destination.
                    </p>

                </div>

                <div class="card-body p-4">

                    <!-- Ciphertext -->

                    <div class="mb-4">

                        <label class="form-label"
                               for="ciphertext">

                            Ciphertext

                        </label>

                        <textarea id="ciphertext"
                                  class="form-control"
                                  rows="6"
                                  placeholder="Paste or scan the ciphertext..."></textarea>

                        <div class="mt-3 d-flex gap-2 flex-wrap">

                            <button id="pasteCipherBtn"
                                    class="btn btn-outline-primary">

                                <i class="bi bi-clipboard"></i>

                                Paste

                            </button>

                            <button id="scanCipherBtn"
                                    class="btn btn-outline-success">

                                <i class="bi bi-qr-code-scan"></i>

                                Scan QR

                            </button>

                        </div>

                    </div>

                    <!-- Key -->

                    <div class="mb-4">

                        <label class="form-label"
                               for="key">

                            Secret Key

                        </label>

                        <input id="key"
                               class="form-control"
                               placeholder="Enter or scan the key">

                        <div class="mt-3 d-flex gap-2 flex-wrap">

                            <button id="pasteKeyBtn"
                                    class="btn btn-outline-primary">

                                <i class="bi bi-clipboard"></i>

                                Paste

                            </button>

                            <button id="scanKeyBtn"
                                    class="btn btn-outline-success">

                                <i class="bi bi-qr-code-scan"></i>

                                Scan QR

                            </button>

                        </div>

                    </div>

                    <!-- Action -->

                    <div class="mb-4">

                        <button id="decryptBtn"
                                class="btn btn-primary">

                            <i class="bi bi-unlock-fill"></i>

                            Decrypt

                        </button>

                        <button id="clearBtn"
                                class="btn btn-outline-secondary">

                            <i class="bi bi-arrow-clockwise"></i>

                            Clear

                        </button>

                    </div>

                    <!-- Scanner -->

                    <!-- QR Scanner Modal -->

<div class="modal fade"
     id="scannerModal"
     tabindex="-1"
     aria-labelledby="scannerModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title"
                    id="scannerModalLabel">

                    Scan QR Code

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>

            </div>

            <div class="modal-body">

                <p class="text-muted text-center">

                    Point your camera at a QR code.

                </p>

                <div id="reader"
                     style="width:100%;">
                </div>

            </div>

        </div>

    </div>

</div>

                    <!-- Result -->

                    <div id="resultSection"
                         class="d-none">

                        <hr>

                        <div class="alert alert-success">

                            <h4 class="mb-3">

                                🎉 Congratulations!

                            </h4>

                            <p class="mb-2">

                                You have successfully decrypted the clue.

                            </p>

                            <div id="messageOutput"
                                 class="output-box"></div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="text-center py-4">

    Cryptographic Treasure Hunt

    <br>

    Powered by AES-256-GCM

</footer>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<!-- Participant Logic -->
<script type="module"
        src="./app.js"></script>

</body>

  </html>
